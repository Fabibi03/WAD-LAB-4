<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Registration</title>
   <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Student Registration</h1>

  <form id="regForm">
    <label for="first">First Name *</label>
    <input type="text" id="first" name="first" />
    <div class="error" id="err-first"></div>

    <label for="last">Last Name *</label>
    <input type="text" id="last" name="last" />
    <div class="error" id="err-last"></div>

    <label for="email">Email *</label>
    <input type="email" id="email" name="email" />
    <div class="error" id="err-email"></div>

    <label for="prog">Programme *</label>
    <input type="text" id="prog" name="prog" />
    <div class="error" id="err-prog"></div>

    <fieldset>
      <legend>Year of Study *</legend>
      <label><input type="radio" name="year" value="1" /> 1</label>
      <label><input type="radio" name="year" value="2" /> 2</label>
      <label><input type="radio" name="year" value="3" /> 3</label>
      <label><input type="radio" name="year" value="4" /> 4</label>
      <div class="error" id="err-year"></div>
    </fieldset>

    <label for="interests">Interests (separate with commas)</label>
    <input type="text" id="interests" name="interests" />

    <label for="photo">Photo URL</label>
    <input type="url" id="photo" name="photo" placeholder="https://example.com/photo.jpg" />

    <button type="submit">Add Student</button>
  </form>

  <div id="live" aria-live="polite" style="text-align: center; margin: 10px; font-weight: bold;"></div>

  <h2>Profile Cards</h2>
  <div id="cards" class="cards"></div>

  <h2>Summary Table</h2>
  <table id="summary">
    <thead>
      <tr>
        <th>Name</th>
        <th>Programme</th>
        <th>Year</th>
        <th>Interests</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button id="fab" title="Go to registration">&#43;</button>

  <script src="script.js"></script>
</body>
</html>
